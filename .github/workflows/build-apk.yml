name: Build WorkoutApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          rm -rf android
          flutter create --empty --platforms=android --org com.workout --project-name workout_app .
          rm -rf test

      - name: Fix Flutter source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")
          s = p.read_text()

          s = s.replace(
              "Colors.black.withOpacity(.72)",
              "Colors.black.withValues(alpha: .72)"
          )

          s = s.replace(
              "activeThumbColor: Colors.white, activeTrackColor: brightRed,",
              "thumbColor: const WidgetStatePropertyAll(Colors.white), "
              "trackColor: const WidgetStatePropertyAll(brightRed),"
          )

          s = s.replace(
              "const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [",
              "Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: ["
          )

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutApp-v0.8-release
          path: build/app/outputs/flutter-apk/app-release.apk
