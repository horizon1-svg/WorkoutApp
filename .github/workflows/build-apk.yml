name: Build WorkoutApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      # The Android folder in this prototype is intentionally regenerated by
      # Flutter so the workflow always has a valid Gradle wrapper and Android
      # template, even when the repository was uploaded from Termux.
      - name: Generate Android platform files
        shell: bash
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.workout \
            --project-name workout_app \
            .

          # Keep a stable package id for personal installs.
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId = "com.workout.workout_app"/applicationId = "com.workout.app"/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.workout.workout_app"/applicationId = "com.workout.app"/g' android/app/build.gradle.kts
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk WorkoutApp-v0.7-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutApp-v0.7-release
          path: WorkoutApp-v0.7-release.apk
          if-no-files-found: error
          retention-days: 14
